# Small, cheap run for checking the harness end to end.
task: tasks/example

agents:
  count: 3
  model:
    id: deepseek/deepseek-v4-flash
    params:
      reasoning: { effort: high }
      temperature: 0.7
      max_tokens: 8000
      provider: { order: [streamlake/fp8] }

environment:
  doc_read_budget: 3

run:
  seed: 1
  tick_cap: 8
  max_cost_usd: 0.25
